name: Build Forge Mod

on:
  push:
    branches:
      - main
      - feature/stable-lock-target-filter-hud
      - upload/compile-source-20260914-2023
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Apply uploaded source package
        run: |
          python .github/scripts/apply_uploaded_source_v2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: apply uploaded source package v2"
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.8'

      - name: Build
        run: gradle clean build --stacktrace --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: invisiblekeybinding-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

name: Build Forge Mod

on:
  push:
    branches:
      - main
      - feature/in-game-config-panel
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.8'

      - name: Apply pending source patch
        if: ${{ hashFiles('scripts/apply_task2.py') != '' }}
        run: |
          python scripts/apply_task2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: centralize aim config ranges and modes"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Build
        run: gradle clean build --stacktrace --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: gun-tracker-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
